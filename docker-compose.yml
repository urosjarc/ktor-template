services:

  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./infra/postgres/volume:/var/lib/postgresql

  redis:
    image: redis:8.2.9
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./infra/redis/users.acl:/usr/local/etc/redis/users.acl:ro
      - ./infra/redis/volume:/data
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf

  postgres-migration:
    image: flyway/flyway:10.20.1
    environment:
      FLYWAY_URL: "jdbc:${DB_TYPE}://postgres:5432/${DB_NAME}"
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
      FLYWAY_LOCATIONS: "filesystem:/flyway/migration"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_CONNECT_RETRIES: "30"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_BASELINE_VERSION: "0"
      FLYWAY_TABLE: "logs_migration"
    command:
      - migrate
    volumes:
      - ./infra/postgres/migration:/flyway/migration:ro
    depends_on:
      - postgres

  postgres-seed:
    image: flyway/flyway:10.20.1
    environment:
      FLYWAY_URL: "jdbc:${DB_TYPE}://postgres:5432/${DB_NAME}"
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
      FLYWAY_LOCATIONS: "filesystem:/flyway/seed"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_CONNECT_RETRIES: "30"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_TABLE: "logs_seed"
      FLYWAY_BASELINE_VERSION: "0"
    command:
      - migrate
    volumes:
      - ./infra/postgres/seed:/flyway/seed:ro
    depends_on:
      - postgres
