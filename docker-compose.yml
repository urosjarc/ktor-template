services:
  postgres:
    image: postgres:bookworm
    ports:
      - "${DB_PORT}:5432"
    env_file: ".env"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}

  flyway-migration:
    image: flyway/flyway:10.20.1
    environment:
      FLYWAY_URL: "jdbc:${DB_TYPE}://postgres:5432/${DB_NAME}"
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
      FLYWAY_LOCATIONS: "filesystem:/flyway/migration"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_CONNECT_RETRIES: "30"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_BASELINE_VERSION: "0"
      FLYWAY_TABLE: "logs_migration"
    command:
      - migrate
    volumes:
      - ./db/migration:/flyway/migration:ro
    depends_on:
      - postgres

  flyway-seed:
    image: flyway/flyway:10.20.1
    environment:
      FLYWAY_URL: "jdbc:${DB_TYPE}://postgres:5432/${DB_NAME}"
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
      FLYWAY_LOCATIONS: "filesystem:/flyway/seed"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_CONNECT_RETRIES: "30"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_TABLE: "logs_seed"
      FLYWAY_BASELINE_VERSION: "0"
    command:
      - migrate
    volumes:
      - ./db/seed:/flyway/seed:ro
    depends_on:
      - postgres
